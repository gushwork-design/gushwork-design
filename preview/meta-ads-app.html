<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meta Ads — Gushwork dashboard system</title>
<link rel="stylesheet" href="../foundation/tokens.css">
<style>  *,*::before,*::after{box-sizing:border-box}

  /* ── Vertical responsiveness ──────────────────────────────────────────────
     The measured Figma values are the UPPER BOUND of each clamp, so a tall
     viewport renders the component exactly as drawn and a short one compresses
     rather than pushing everything below the fold. Horizontal values are never
     clamped — those are the measured widths and stay exact. */
  :root{
    --v-rhythm: clamp(16px, 3.2vh, 40px);   /* slot padding + section gap · measured 40 */
    --v-kpi:    clamp(140px, 21vh, 198px);  /* kpi-card height        · measured 198 */
    --v-kpigap: clamp(12px, 8vh, 80px);     /* kpi header→value gap   · measured 80 */
    --v-plot:   clamp(120px, 21vh, 200px);  /* chart plot height */
    --v-hdr:    clamp(16px, 3.2vh, 40px);   /* header top padding     · measured 40 */
    --v-railpad:clamp(12px, 2.4vh, 24px);   /* rail vertical padding  · measured 24 */
    --v-railgap:clamp(14px, 4vh, 40px);     /* title→nav gap          · measured 40 */
    --v-grpgap: clamp(8px, 2.4vh, 24px);    /* between nav groups     · measured 24 */
  }
  /* The page itself never scrolls. dashboard-build is a fixed shell whose Slot
     scrolls — so the rail and the sticky header stay put. Measured height is 888;
     here it is locked to the viewport instead so the app fills the window. */
  html,body{height:100%;overflow:hidden}
  body{margin:0;background:var(--gw-color-neutral-100);font:var(--gw-text-body-14-reg);
       color:var(--gw-color-black);-webkit-font-smoothing:antialiased}

  /* EXTENSION, not measured: the shell is fluid. Figma's dashboard-build is a fixed
     1440 x 888. The rail keeps its measured 260; the container flexes. */
  .shell{width:100%;height:100vh;display:flex;gap:0;
         padding:var(--gw-space-8) var(--gw-space-8) 0;align-items:stretch}

  /* side-panel — no fill, r20, pad 16/24, space-between. Never scrolls with the page. */
  .rail{width:260px;flex:none;border-radius:var(--gw-radius-20);background:transparent;
        padding:var(--v-railpad) var(--gw-space-16);display:flex;flex-direction:column;
        justify-content:space-between;min-height:0;overflow:hidden}
  /* Only the nav list scrolls when it cannot fit. The user-card sits outside it and
     stays pinned, so the rail as a whole never appears to scroll away. */
  .rail__container{display:flex;flex-direction:column;gap:var(--v-railgap);width:100%;
                   min-height:0;overflow-y:auto}
  .rail__container{scrollbar-width:none;-ms-overflow-style:none}
  .rail__container::-webkit-scrollbar{width:0;height:0;display:none}
  .rail__title{height:32px;flex:none;display:flex;align-items:center;gap:var(--gw-space-8)}
  .logotile{width:32px;height:32px;flex:none;border-radius:var(--gw-radius-8);
            background:var(--gw-color-black);padding:var(--gw-space-8);display:flex}
  .logotile img{width:100%;height:100%;object-fit:contain}
  .rail__name{font:600 18px/1 var(--gw-font-display);color:var(--gw-color-black)}
  .groups{display:flex;flex-direction:column;gap:var(--v-grpgap)}
  .li{display:flex;align-items:center;gap:var(--gw-space-8);height:32px;width:228px;
      padding:var(--gw-space-8);border-radius:var(--gw-radius-8);font:var(--gw-text-button-14);
      color:var(--gw-color-neutral-900);text-decoration:none;cursor:pointer}
  .li svg{width:16px;height:16px;flex:none;color:currentColor}
  .li:hover{background:var(--gw-color-neutral-25)}
  .li--sel{background:var(--gw-color-neutral-50)}
  .li--group{height:auto;width:228px;padding:var(--gw-space-4) var(--gw-space-8);
             border-radius:var(--gw-radius-8);font:var(--gw-text-body-10-sem);
             text-transform:uppercase;color:var(--gw-color-neutral-400);display:flex;align-items:center}
  .ucwrap{border-top:1px solid var(--gw-color-neutral-alpha-10-black);
          padding:var(--gw-space-8) 0;width:228px;height:64px;flex:none}
  .usercard{height:48px;display:flex;align-items:center;justify-content:space-between;
            padding:var(--gw-space-8) var(--gw-space-4);border-radius:var(--gw-radius-12)}
  .uc__l{display:flex;align-items:center;gap:var(--gw-space-8)}
  .uc__av{width:42.667px;height:32px;flex:none;border-radius:53.333px;
          background:var(--gw-color-neutral-50);border:.333px solid var(--gw-color-neutral-100);
          overflow:hidden;position:relative}
  .uc__av img{position:absolute;left:7.11px;top:3.56px;width:25.448px;height:57.753px}
  .uc__n{display:flex;flex-direction:column;gap:var(--gw-space-4)}
  .uc__n b{font:var(--gw-text-button-12);color:var(--gw-color-black)}
  .uc__n span{font:var(--gw-text-button-10);color:var(--gw-color-neutral-400)}
  .uc__m{padding:var(--gw-space-4);border-radius:var(--gw-radius-4);
         color:var(--gw-color-neutral-500);display:flex}
  .uc__m svg{width:12px;height:12px}

  /* dashboard-container — r20, white. Runs to the shell bottom like the measured 872. */
  .main{flex:1;min-width:0;min-height:0;border-radius:var(--gw-radius-20) var(--gw-radius-20) 0 0;
        background:var(--gw-color-white);display:flex;flex-direction:column;overflow:hidden}

  /* section/header — sticky, pad 40/40/20, title h5, 1px neutral-50 rule */
  .hdr{padding:var(--v-hdr) var(--gw-space-40) var(--gw-space-20);display:flex;
       flex-direction:column;gap:var(--gw-space-20);flex:none;
       border-bottom:1px solid var(--gw-color-neutral-50);background:var(--gw-color-white)}
  .hdr h1{margin:0;font:var(--gw-text-h5);letter-spacing:var(--gw-text-h5-tracking);
          color:var(--gw-color-neutral-900)}
  .toolbar{display:flex;align-items:center;gap:var(--gw-space-12);flex-wrap:wrap}
  .tabs{display:inline-flex;gap:var(--gw-space-8);background:var(--gw-color-neutral-50);
        border-radius:var(--gw-radius-8);padding:var(--gw-space-4)}
  .tab{padding:var(--gw-space-4) var(--gw-space-8);border-radius:var(--gw-radius-4);
       font:var(--gw-text-body-12-med);color:var(--gw-color-neutral-900);cursor:pointer}
  .tab--sel{background:var(--gw-color-white);box-shadow:var(--gw-shadow-s3)}
  .dd{display:inline-flex;align-items:center;justify-content:space-between;min-width:120px;
      padding:var(--gw-space-8);border-radius:var(--gw-radius-8);gap:var(--gw-space-8);
      background:var(--gw-color-neutral-50);font:var(--gw-text-body-12-med);
      color:var(--gw-color-neutral-900);cursor:pointer}
  .dd svg{width:12px;height:12px;color:var(--gw-color-neutral-500);flex:none}
  .refresh{margin-left:auto;display:flex;align-items:center;gap:var(--gw-space-8)}
  .refresh span{font:var(--gw-text-button-10);color:var(--gw-color-neutral-700)}
  .refresh button{width:28px;height:28px;border-radius:var(--gw-radius-8);
                  border:2px solid var(--gw-color-neutral-100);background:transparent;
                  color:var(--gw-color-neutral-700);cursor:pointer;display:flex;
                  align-items:center;justify-content:center}
  .refresh svg{width:16px;height:16px}

  /* Slot — the ONLY scrolling region. Sections only, gap 40, pad 40. */
  .slot{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;
        gap:var(--v-rhythm);padding:var(--v-rhythm) var(--gw-space-40)}
  /* Sections must keep their natural height. As flex items in a fixed-height slot they
     default to flex-shrink:1 and get COMPRESSED instead of letting the slot scroll —
     which silently collapsed graph bodies to a sliver. */
  .slot > *{flex:0 0 auto}

  /* Hide the scrollbar chrome on the two scrolling regions while keeping them
     scrollable. NOT a measured value — a product choice. Figma has no scrollbar
     spec, and the shell reads cleaner without one. */
  .slot,.rail{scrollbar-width:none;-ms-overflow-style:none}
  .slot::-webkit-scrollbar,.rail::-webkit-scrollbar{width:0;height:0;display:none}

  /* section/card-layout — cards FILL the section */
  .cl{display:flex;flex-direction:column;gap:var(--gw-space-8)}
  .cl__krow{display:flex;gap:var(--gw-space-8)}
  .cl__arow{display:flex;gap:var(--gw-space-8)}
  .cl--side{flex-direction:row;gap:var(--gw-space-8)}
  .cl__kside{display:flex;gap:var(--gw-space-8);min-width:0}
  .cl__agrid{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--gw-space-8);min-width:0}
  /* measured splits of the 1084 section: KPI cards=1 is 400 + 676, =2 is 580 + 496 */
  .cl--side[data-k="1"] .cl__kside{flex:400 1 0}
  .cl--side[data-k="1"] .cl__agrid{flex:676 1 0}
  .cl--side[data-k="2"] .cl__kside{flex:580 1 0}
  .cl--side[data-k="2"] .cl__agrid{flex:496 1 0}
  /* the KPI floor must not fight the split when the shell is narrow */
  .cl--side .kpi{min-width:0}

  /* ── Wide screens ────────────────────────────────────────────────────────
     The analytics grid is 3 columns at 1440. Past ~1800 that leaves a sparse
     3x2 block beside the KPI, so it opens out. Card widths stay measured
     minimums; only the column count changes. */
  @media (min-width:1800px){
    .cl--side[data-k="1"] .cl__agrid{grid-template-columns:repeat(6,1fr)}
    .cl--side[data-k="2"] .cl__agrid{grid-template-columns:repeat(3,1fr)}
    /* A kpi-card is 286–400 as measured. Left to the 36.9% split it reaches 715 on a
       2400 display — a mostly empty box around a 32px number. Cap it and let the
       analytics grid absorb the rest. */
    .cl--side[data-k="1"] .cl__kside{max-width:480px}
    .cl--side[data-k="2"] .cl__kside{max-width:820px}
  }
  @media (min-width:2200px){
    .cl--side[data-k="2"] .cl__agrid{grid-template-columns:repeat(6,1fr)}
    /* keep the reading measure sane on very wide displays */
    .slot{padding-inline:clamp(40px,4vw,96px)}
  }

  /* kpi-card — 286x198 intrinsic, DARK neutral-900, gap 80 */
  .kpi{flex:1;min-width:286px;height:var(--v-kpi);border-radius:var(--gw-radius-12);
       padding:var(--gw-space-20);background:var(--gw-color-neutral-900);
       display:flex;flex-direction:column;justify-content:space-between;
       gap:var(--v-kpigap);overflow:hidden}
  .kpi__hd{display:flex;align-items:center;justify-content:space-between;width:100%}
  .kpi__t{font:500 10px/1.6 var(--gw-font-body);text-transform:uppercase;
          color:var(--gw-color-neutral-300)}
  .kpi__hd svg{width:16px;height:16px;color:var(--gw-color-neutral-300);flex:none}
  .kpi__body{display:flex;flex-direction:column;gap:var(--gw-space-8);width:100%}
  .kpi__vrow{display:flex;align-items:center;gap:var(--gw-space-8);flex-wrap:wrap}
  .kpi__v{font:var(--gw-text-h5);color:var(--gw-color-white)}
  .kpi__cap{font:var(--gw-text-body-12-med);color:var(--gw-color-neutral-300);letter-spacing:-.072px}
  .kpib{display:inline-flex;align-items:center;gap:2px;padding:4px var(--gw-space-8);
        border-radius:var(--gw-radius-4);font:var(--gw-text-body-12-med);letter-spacing:-.072px}
  .kpib svg{width:12px;height:12px}
  .kpib--pos{background:var(--gw-color-green-alpha-10);color:var(--gw-color-green-300)}
  .kpib--neg{background:var(--gw-color-red-alpha-20);color:var(--gw-color-red-300)}

  /* analytics-card — 160 intrinsic, value = display face Medium 20 */
  .ana{flex:1;min-width:160px;border-radius:var(--gw-radius-12);padding:var(--gw-space-12);
       background:var(--gw-color-neutral-25);display:flex;flex-direction:column;
       gap:var(--gw-space-20);overflow:hidden}
  .ana__l{font:500 10px/1 var(--gw-font-body);text-transform:uppercase;
          color:var(--gw-color-neutral-600)}
  .ana__stack{display:flex;flex-direction:column;gap:var(--gw-space-4);width:100%}
  .ana__v{font:500 20px/1 var(--gw-font-display);color:var(--gw-color-black)}
  .ana__c{font:var(--gw-text-body-12-med);color:var(--gw-color-neutral-600)}

  /* section shell — Container / With Dropdown / table */
  .sec{border-radius:var(--gw-radius-12);padding:var(--gw-space-12);
       background:var(--gw-color-neutral-25);display:flex;flex-direction:column;
       gap:clamp(8px,1.6vh,16px);overflow:hidden}
  .sec__hd{display:flex;align-items:center;justify-content:space-between;
           padding:var(--gw-space-4);width:100%;gap:var(--gw-space-12)}
  .sec__ttl{display:flex;align-items:center;gap:var(--gw-space-8);min-width:0}
  .sec__ico{width:20px;height:20px;border-radius:var(--gw-radius-4);padding:4px;flex:none;
            background:var(--gw-color-primary-alpha-10);color:var(--gw-color-primary-500);
            display:flex;align-items:center;justify-content:center}
  .sec__ico svg{width:12px;height:12px}
  .sec__t{font:600 14px/1 var(--gw-font-body);letter-spacing:-.2px;
          color:var(--gw-color-neutral-800)}
  .sec__caret{width:12px;height:12px;color:var(--gw-color-neutral-400);flex:none}
  .sec__caret--up{transform:scaleY(-1)}
  .sec__body{background:var(--gw-color-white);border:1px solid var(--gw-color-neutral-50);
             border-radius:var(--gw-radius-8);padding:var(--gw-space-16);width:100%;
             overflow-x:auto}
  .subgroup{display:flex;flex-direction:column;gap:var(--gw-space-8);width:100%}
  .subttl{font:500 10px/1.6 var(--gw-font-body);text-transform:uppercase;
          color:var(--gw-color-neutral-500);padding:var(--gw-space-4)}

  /* progress-bar */
  .pb{border-radius:var(--gw-radius-16);padding:clamp(12px,2vh,20px);
      background:var(--gw-color-neutral-25);display:flex;flex-direction:column;
      gap:clamp(8px,1.6vh,16px)}
  .pb__hd{display:flex;align-items:center;gap:var(--gw-space-8);padding:var(--gw-space-4)}
  .pb__ico{width:20px;height:20px;border-radius:var(--gw-radius-4);padding:var(--gw-space-4);
           background:var(--gw-color-primary-alpha-10);color:var(--gw-color-primary-500);
           display:flex;align-items:center;justify-content:center;flex:none}
  .pb__ico svg{width:12px;height:12px}
  .pb__l{font:var(--gw-text-body-14-sem);color:var(--gw-color-neutral-800);letter-spacing:-.2px}
  .pb__c{margin-left:auto;font:var(--gw-text-body-14-med);color:var(--gw-color-neutral-500);
         letter-spacing:-.2px}
  .pb__track{height:32px;border-radius:var(--gw-radius-8);
             background:var(--gw-color-neutral-100);overflow:hidden}
  .pb__fill{height:100%;border-radius:var(--gw-radius-8);
            background:var(--gw-color-primary-500);color:var(--gw-color-white);
            display:flex;align-items:center;justify-content:flex-end;
            padding-right:var(--gw-space-12);font:var(--gw-text-body-14-med)}

  /* Graph */
  .gr__row{display:flex;gap:var(--gw-space-12)}
  .gr__y{display:flex;flex-direction:column;gap:clamp(10px,2vh,20px);flex:none;
         font:500 12px/1 var(--gw-font-body);letter-spacing:-.2px;color:var(--gw-color-neutral-600)}
  .gr__y--line{justify-content:space-between;gap:0;height:var(--v-plot)}
  .gr__area{flex:1;display:flex;flex-direction:column;gap:var(--gw-space-16);min-width:0}
  .gr__plot{display:flex;flex-direction:column;gap:clamp(10px,2vh,20px);
            padding-block:clamp(8px,1.6vh,16px)}
  .gr__x{display:flex;justify-content:space-between;font:500 12px/1 var(--gw-font-body);
         letter-spacing:-.2px;color:var(--gw-color-neutral-600)}
  .gbar{height:10px;background:var(--gw-color-primary-500);border-radius:0 2px 2px 0;position:relative}
  .gbar span{position:absolute;left:calc(100% + 4px);top:-2px;white-space:nowrap;
             font:500 10px/1 var(--gw-font-body);letter-spacing:-.2px;color:var(--gw-color-black)}
  .gline{position:relative;height:var(--v-plot)}
  .gline svg{width:100%;height:100%;display:block}

  /* table */
  .tblwrap{border-radius:var(--gw-radius-12);background:var(--gw-color-white);
           overflow:hidden;width:100%}
  .dt{width:100%;border-collapse:collapse;background:var(--gw-color-white)}
  .dt th,.dt td{text-align:left;padding:12px 24px;
                border-bottom:1px solid var(--gw-color-neutral-200);
                font:var(--gw-text-body-14-med);color:var(--gw-color-neutral-600);
                letter-spacing:-.028px}
  .dt tr:last-child td{border-bottom:0}
  /* the action column never grows; the name column absorbs the slack */
  .dt__act,.dt td:last-child{width:56px}
  .dt th:first-child,.dt td:first-child{width:auto}
  .tbar{display:flex;align-items:center;gap:var(--gw-space-12);padding:16px 24px}
  .tbar__l{font:var(--gw-text-body-14-med);color:var(--gw-color-neutral-600)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--gw-space-8);
       height:28px;padding:0 var(--gw-space-12);border:0;border-radius:var(--gw-radius-8);
       font:var(--gw-text-button-12);cursor:pointer}
  .btn--primary{background:var(--gw-color-black);color:var(--gw-color-white)}
  .btn--outline{background:transparent;color:var(--gw-color-black);
                box-shadow:inset 0 0 0 1px var(--gw-color-neutral-200)}
  .btn--ghost{background:transparent;color:var(--gw-color-neutral-700);width:28px;padding:0}
  .btn svg{width:14px;height:14px}
  .pager{margin-left:auto;display:flex;align-items:center;gap:var(--gw-space-4)}
  .pager span{min-width:28px;height:28px;border-radius:var(--gw-radius-8);
              display:inline-flex;align-items:center;justify-content:center;
              font:var(--gw-text-body-12-med);color:var(--gw-color-neutral-700);cursor:pointer}
  .pager .cur{background:var(--gw-color-neutral-50);color:var(--gw-color-black)}

  /* With Dropdown cells */
  .cells{display:flex;align-items:stretch;gap:var(--gw-space-8)}
  .cell{min-width:100px;flex:1;padding:var(--gw-space-4) var(--gw-space-8);
        display:flex;flex-direction:column;gap:var(--gw-space-4);white-space:nowrap}
  .cell__l{font:500 10px/1.6 var(--gw-font-body);text-transform:uppercase;
           color:var(--gw-color-neutral-600)}
  .cell__v{font:500 18px/1.2 var(--gw-font-display);color:var(--gw-color-neutral-900)}
  .cell__sep{width:1px;align-self:stretch;background:var(--gw-color-neutral-100);flex:none}
  .secdd{background:var(--gw-color-white);border-radius:var(--gw-radius-8);
         padding:var(--gw-space-8);min-width:140px;display:flex;align-items:center;
         justify-content:space-between;gap:var(--gw-space-8);width:466px;max-width:60%}
  .secdd__l{font:600 14px/1 var(--gw-font-body);letter-spacing:-.2px;
            color:var(--gw-color-neutral-800)}

  .badge{display:inline-flex;align-items:center;padding:4px var(--gw-space-8);
         border-radius:var(--gw-radius-4);font:var(--gw-text-body-12-med);white-space:nowrap}
  .badge--g{background:var(--gw-color-green-alpha-10);color:var(--gw-color-green-500)}
  .badge--n{background:var(--gw-color-neutral-100);color:var(--gw-color-neutral-600)}
  .badge--r{background:var(--gw-color-red-alpha-10);color:var(--gw-color-red-500)}
  .badge--y{background:var(--gw-color-yellow-alpha-10);color:var(--gw-color-yellow-500)}
</style></head>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">

  if (location.hash.slice(1) !== id) history.replaceState(null,'','#'+id);
}
document.querySelectorAll('.li[data-page]').forEach(a =>
  a.addEventListener('click', e => { e.preventDefault(); show(a.dataset.page); }));
show(location.hash.slice(1) in PAGES ? location.hash.slice(1) : 'command-center');
</script>
</body></html>
